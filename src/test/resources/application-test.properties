# Atención: ese '\\' es doble barra invertida a propósito.
# java.util.Properties la colapsa en '\' y H2 recibe '\;', que es su escape del ';' interno de INIT.
# Si se deja una sola barra, Properties entrega ';' crudo, H2 lo interpreta como un setting sin '='
# y falla con "URL format error" (el mensaje muestra solo "jdbc:h2:mem:testdb"). No quitarla.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS connect_rural\\;SET SCHEMA connect_rural
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.liquibase.enabled=false

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=connect_rural
spring.jpa.show-sql=false
