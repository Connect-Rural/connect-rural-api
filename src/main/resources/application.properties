spring.application.name=connect-rural-api


spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=connect_rural

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.default-schema=connect_rural
spring.liquibase.liquibase-schema=connect_rural

# Logging
logging.level.root=WARN
logging.level.com.crdev.connect_rural_api=INFO
logging.level.liquibase=INFO

# WhatsApp Gateway
whatsapp.gateway.url=${WHATSAPP_GATEWAY_URL:http://localhost:8081}
app.base-url=${APP_BASE_URL:http://localhost:8080}

# MinIO
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:uploads}

# Multipart (no size limits)
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1
